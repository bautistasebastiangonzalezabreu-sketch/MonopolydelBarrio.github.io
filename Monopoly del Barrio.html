/* ===== MODO ONLINE: sala con código, cada jugador controla su ficha ===== */
/* Cada jugada la hace quien tiene el turno en su propio dispositivo y se guarda el estado completo
   en la base compartida; los demás lo reciben, ven la animación y esperan su turno. */
const ON = {st: 'none', code: '', uid: null, db: null, room: null, seats: [], uids: [], seat: -1, unsubs: [], name: '', join: '', err: '', seq: 0, out: null, writing: false, incoming: null, ready: null};
const ROOM_KEY = 'monopoly-online-room';
const GAMEACTS = new Set(['roll','dice','buy','nobuy','mkbuy','mkskip','bid','apass','endturn','ack','pay','askbk','cancelbk','bankrupt','jailpay','jailcard','build','sell','mort','unmort','trade','tpartner','tsq','tcash','tjail','tsend','tcancel','taccept','treject']);
const rPath = () => 'rooms/' + ON.code;
const online = () => ON.st === 'game';

function actorId() {
  const pd = G.pending;
  if (!pd) return G.turn;
  if (pd.type === 'auction') return pd.cur;
  if (pd.type === 'trade') return pd.to;
  return pd.pid !== undefined ? pd.pid : G.turn;
}
const canAct = () => !online() || (G.phase !== 'over' && ON.seat >= 0 && actorId() === ON.seat);
function waitText() {
  const pd = G.pending, who = G.players[actorId()], s = pd && pd.sq !== undefined ? BOARD[pd.sq] : null;
  if (!pd) return 'Esperando a ' + who.name + '…';
  if (pd.type === 'card') return who.name + ' sacó una carta: ' + (pd.kind === 'luck' ? LUCK : MULT)[pd.id].x;
  if (pd.type === 'auction') return 'Subasta de ' + s.name + ': puja ' + fmt(pd.bid) + (pd.leader >= 0 ? ' de ' + G.players[pd.leader].name : '') + '. Le toca a ' + who.name + '.';
  if (pd.type === 'trade') return G.players[pd.from].name + ' le propone un intercambio a ' + who.name + '.';
  if (pd.type === 'market') return who.name + ' está en la Inmobiliaria.';
  if (pd.type === 'buy') return who.name + ' decide si compra ' + s.name + '.';
  if (pd.type === 'debt') return who.name + ' tiene que pagar ' + fmt(pd.amount) + '.';
  return 'Esperando a ' + who.name + '…';
}
function onlineBanner() {
  if (!online()) return '';
  const me = ON.seat >= 0 ? G.players[ON.seat] : null;
  let h = '<div class="box onb">' + (me ? 'Sos <b>' + esc(me.name) + '</b> (ficha ' + (ON.seat + 1) + '). ' : 'Estás mirando la partida. ') + 'Sala <b class="mono">' + esc(ON.code) + '</b>.';
  if (G.phase !== 'over') h += canAct() ? ' <b>Te toca.</b>' : '<br>' + esc(waitText());
  return h + (ON.err ? '<br><span class="err" role="alert">' + esc(ON.err) + '</span>' : '') + '</div>';
}
function decorate() {
  if (!online() || canAct()) return;
  document.querySelectorAll('#side [data-act]').forEach(e => { if (['sq','quit'].indexOf(e.dataset.act) < 0) e.disabled = true; });
}

/* ----- conexión y escritura ----- */
function errMsg(e) {
  const c = e && e.code;
  if (c === 'not_permitted') return 'Tu cuenta no puede escribir en la sala. Pedile al dueño de la página que te dé acceso de Colaborador.';
  if (c === 'quota_exceeded') return 'Se llenó el espacio de la base de datos.';
  return 'No se pudo conectar con la sala' + (e && e.message ? ' (' + e.message + ')' : '') + '.';
}
function onlineInit() {
  if (ON.ready) return ON.ready;
  ON.ready = (async () => {
    if (typeof claude === 'undefined' || !claude.use) throw new Error('local');
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) throw new Error('nodb');
    ON.db = db; ON.uid = uid;
  })();
  ON.ready.catch(() => { ON.ready = null; });
  return ON.ready;
}
async function flush() {
  if (ON.writing) return;
  ON.writing = true;
  try { while (ON.out) { const o = ON.out; ON.out = null; await ON.db.doc(rPath() + '/game/state').set(o); } }
  catch (e) { ON.err = errMsg(e); render(); }
  ON.writing = false;
}
function pushState(segs, fx) {
  if (!online()) return;
  if (G.log.length > 40) G.log.splice(0, G.log.length - 40);
  ON.seq++;
  ON.out = {seq: ON.seq, by: ON.uid, uids: ON.uids, json: JSON.stringify(G), anim: segs || [], sfx: fx || []};
  flush();
}
function myData() {
  const m = ON.seats.find(s => s.uid === ON.uid);
  return m || {uid: ON.uid, name: ON.name, rubros: ['pan', 'ver'], t: Date.now()};
}
async function writeSeat(patch) {
  const m = Object.assign({}, myData(), patch, {uid: ON.uid});
  const i = ON.seats.findIndex(x => x.uid === ON.uid); if (i >= 0) ON.seats[i] = m; else ON.seats.push(m);
  if (ON.st === 'lobby') render();
  try { await ON.db.doc(rPath() + '/seats/' + ON.uid).set(m); } catch (e) { ON.err = errMsg(e); render(); }
}
async function writeCfg() { try { await ON.db.doc(rPath()).update({cfg: ON.room.cfg}); } catch (e) { ON.err = errMsg(e); render(); } }

function unsubAll() { ON.unsubs.forEach(f => { try { f(); } catch (e) {} }); ON.unsubs = []; }
function listen(code) {
  ON.code = code; ON.room = null; ON.seats = []; ON.seq = 0; ON.err = ''; ON.st = 'lobby';
  try { localStorage.setItem(ROOM_KEY, code); } catch (e) {}
  const er = e => { ON.err = errMsg(e); render(); };
  ON.unsubs.push(ON.db.doc(rPath()).onSnapshot(s => {
    ON.room = s.exists ? s.data() : null;
    if (ON.room && ON.room.cfg && ON.st === 'lobby') setBoardTheme(ON.room.cfg.theme);
    if (ON.st === 'lobby') render();
  }, er));
  ON.unsubs.push(ON.db.collection(rPath() + '/seats').onSnapshot(s => {
    ON.seats = s.docs.map(d => d.data()).sort((a, b) => a.t - b.t);
    if (ON.st === 'lobby') render();
  }, er));
  ON.unsubs.push(ON.db.doc(rPath() + '/game/state').onSnapshot(s => { if (s.exists) onGameState(s.data()); }, er));
}
async function leaveRoom() {
  unsubAll(); ON.st = 'none'; ON.code = ''; ON.err = ''; ON.out = null; ON.incoming = null;
  try { localStorage.removeItem(ROOM_KEY); } catch (e) {}
  G = null; atMenu = true; render(); window.scrollTo(0, 0);
}

/* ----- crear, unirse, empezar ----- */
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const newCode = () => range(4).map(() => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
async function createRoom() {
  try {
    await onlineInit();
    let code = newCode();
    for (let k = 0; k < 6; k++) { const s = await ON.db.doc('rooms/' + code).get(); if (!s.exists) break; code = newCode(); }
    ON.code = code;
    await ON.db.doc('rooms/' + code).set({host: ON.uid, t: Date.now(), cfg: {mode: cfg.mode, dice: cfg.dice, startCash: cfg.startCash, goal: cfg.goal, theme: cfg.theme}});
    await writeSeat({name: (ON.name || '').trim() || 'Jugador 1', rubros: ['pan', 'ver'], t: Date.now()});
    listen(code);
  } catch (e) { ON.err = e && e.message === 'nodb' || e && e.message === 'local' ? 'El modo online solo funciona desde la página publicada, con tu sesión iniciada.' : errMsg(e); }
  render();
}
async function joinRoom(code, rejoin) {
  code = (code || '').trim().toUpperCase();
  try {
    await onlineInit();
    ON.code = code;
    const r = await ON.db.doc('rooms/' + code).get();
    if (!r.exists) { ON.err = 'No existe una sala con ese código.'; render(); return; }
    const mine = (await ON.db.doc('rooms/' + code + '/seats/' + ON.uid).get()).exists;
    const gs = await ON.db.doc('rooms/' + code + '/game/state').get();
    if (!mine) {
      if (gs.exists) { ON.err = 'Esa partida ya empezó.'; render(); return; }
      const all = await ON.db.collection('rooms/' + code + '/seats').get();
      if (all.size >= 4) { ON.err = 'La sala está llena (máximo 4 jugadores).'; render(); return; }
      await writeSeat({name: (ON.name || '').trim() || 'Jugador', rubros: DEF_RUB[Math.min(all.size, 3)].slice(), t: Date.now()});
    }
    listen(code);
  } catch (e) { ON.err = e && (e.message === 'nodb' || e.message === 'local') ? 'El modo online solo funciona desde la página publicada, con tu sesión iniciada.' : errMsg(e); if (rejoin) { try { localStorage.removeItem(ROOM_KEY); } catch (x) {} } }
  render();
}
async function startOnline() {
  const seats = ON.seats.slice(0, 4), c = ON.room.cfg;
  if (seats.length < 2 || seats.some(s => s.rubros.length !== 2)) return;
  setBoardTheme(c.theme);
  const g = newGame({mode: c.mode, dice: c.dice, startCash: c.startCash, goal: c.goal, theme: c.theme, maxRounds: 50,
    players: seats.map((s, i) => ({name: (s.name || '').trim() || 'Jugador ' + (i + 1), rubros: s.rubros}))});
  try {
    await ON.db.doc(rPath() + '/game/state').set({seq: 1, by: ON.uid, uids: seats.map(s => s.uid), json: JSON.stringify(g), anim: [], sfx: []});
    await ON.db.doc(rPath()).update({started: true});
  } catch (e) { ON.err = errMsg(e); render(); }
}

/* ----- recibir jugadas de los demás ----- */
function loadRemote(d) {
  G = JSON.parse(d.json); G.anim = []; G.sfx = []; ON.seq = d.seq; ON.uids = d.uids;
  setBoardTheme(G.theme || 'barrio');
  ON.seat = ON.uids.indexOf(ON.uid);
}
function onGameState(d) {
  if (!online()) {
    loadRemote(d); ON.st = 'game';
    ui = {sel: null, anim: false, confirmBk: false, over: true, trade: null, disp: []};
    buildShell(); render(); window.scrollTo(0, 0); Snd.play('turn'); return;
  }
  if (d.by === ON.uid || d.seq <= ON.seq) return;
  ON.incoming = d; drainRemote();
}
async function drainRemote() {
  if (ui.anim || !ON.incoming) return;
  const d = ON.incoming; ON.incoming = null;
  ui.anim = true;
  try {
    loadRemote(d);
    if (d.anim.length) { const el = $('dice'); if (el) el.innerHTML = diceInner(); await runAnims(d.anim); }
    playFx(d.sfx);
  } catch (e) { console.error(e); }
  ui.disp = []; ui.anim = false; render();
  if (ON.incoming) drainRemote();
}

/* ----- pantallas ----- */
function cfgBox(c, editable) {
  const dis = editable ? '' : ' disabled';
  const seg = (label, k, list, val) => '<div style="margin-bottom:12px"><div class="hint" style="font-weight:700;margin-bottom:6px">' + label + '</div><div class="seg sm" role="group" aria-label="' + label + '">' +
    list.map(a => '<button aria-pressed="' + (val === a[0]) + '" data-act="ocfg" data-k="' + k + '" data-v="' + a[0] + '"' + dis + '>' + a[1] + '</button>').join('') + '</div></div>';
  return '<div class="box"><h2>Partida</h2>' +
    seg('Modo', 'mode', [['classic', 'Clásico'], ['mixed', 'Mixto']], c.mode) +
    seg('Dados', 'dice', [[2, '2 dados'], [1, '1 dado'], ['mixed', 'Mixto']], c.dice) +
    seg('Tablero', 'theme', Object.keys(THEMES).map(k => [k, THEMES[k].label]), c.theme) +
    (editable ? rng('ocash', 'Dinero inicial', CASH_MIN, CASH_MAX, 100, c.startCash) + rng('ogoal', 'Meta para ganar', GOAL_MIN, GOAL_MAX, 250, c.goal)
      : '<p class="hint" style="margin:0">Dinero inicial ' + fmt(c.startCash) + ' · Meta ' + fmt(c.goal) + ' de patrimonio.</p>') +
    '</div>';
}
function renderOnline() {
  const err = ON.err ? '<p class="err" role="alert">' + esc(ON.err) + '</p>' : '';
  if (ON.st === 'lobby') {
    const room = ON.room;
    if (!room) { $app.innerHTML = '<p class="hint" role="status">Entrando a la sala…</p>' + err; return; }
    const host = room.host === ON.uid, c = room.cfg, me = myData();
    const list = ON.seats.slice(0, 4).map((s, i) => '<div class="prow"><div class="who"><span class="dot" style="background:' + PCOL[i] + '">' + (i + 1) + '</span><b>' + esc(s.name) + '</b>' + (s.uid === room.host ? ' <span class="mini neutral">Anfitrión</span>' : '') + (s.uid === ON.uid ? ' <span class="mini neutral">Vos</span>' : '') + '</div>' +
      '<div class="tagline">' + s.rubros.map(r => '<span class="mini" style="--c:' + GCOL[r] + '">' + RUBRO[r].name + '</span>').join('') + (s.rubros.length !== 2 ? '<span class="hint">Falta elegir rubros</span>' : '') + '</div></div>').join('');
    const ready = ON.seats.length >= 2 && ON.seats.slice(0, 4).every(s => s.rubros.length === 2);
    $app.innerHTML = '<header class="hero"><div class="awning"></div><h1 class="display">Sala <span class="mono" style="letter-spacing:.12em">' + esc(ON.code) + '</span></h1><p>Pasales este código a tus amigos: lo ponen en “Unirme” desde su dispositivo. Pueden jugar hasta 4.</p></header>' +
      '<div class="cfg"><div class="box"><h2>Jugadores (' + Math.min(4, ON.seats.length) + ' de 4)</h2>' + list +
      '<h2 style="margin-top:16px">Tu nombre y tus rubros</h2><div class="prow"><div class="who"><input class="input" id="oname" maxlength="14" value="' + esc(me.name) + '" aria-label="Tu nombre"></div>' +
      '<div class="chips" role="group" aria-label="Tus rubros">' + RUBROS.map(r => '<button class="chip" style="--c:' + GCOL[r.id] + '" aria-pressed="' + (me.rubros.indexOf(r.id) >= 0) + '" data-act="orubro" data-r="' + r.id + '"><i></i>' + r.name + '</button>').join('') + '</div></div></div>' +
      cfgBox(c, host) + '</div>' + err +
      '<div class="startbar">' + (host ? '<button class="btn primary start" data-act="ostart"' + (ready ? '' : ' disabled') + '>Empezar la partida</button><span class="hint">' + (ready ? 'Cada jugador controla su ficha desde su dispositivo.' : 'Hacen falta al menos 2 jugadores con 2 rubros cada uno.') + '</span>' : '<span class="hint" role="status">Esperando a que el anfitrión empiece la partida…</span>') +
      '<button class="btn" data-act="oleave">Salir de la sala</button></div>';
    return;
  }
  $app.innerHTML = '<header class="hero"><div class="awning"></div><h1 class="display">Jugar online</h1><p>Cada jugador entra desde su propio dispositivo, controla su ficha y juega cuando le toca.</p></header>' +
    '<div class="cfg"><div class="box"><h2>Tu nombre</h2><input class="input" id="oname" maxlength="14" value="' + esc(ON.name) + '" placeholder="Jugador" aria-label="Tu nombre"></div>' +
    '<div class="box"><h2>Crear una sala</h2><p class="hint" style="margin:0 0 12px">Elegís las reglas y compartís el código de 4 letras.</p><button class="btn primary" data-act="ocreate">Crear sala</button></div>' +
    '<div class="box"><h2>Unirme a una sala</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="input mono" id="ocode" maxlength="4" value="' + esc(ON.join) + '" placeholder="CÓDIGO" style="text-transform:uppercase;max-width:160px" aria-label="Código de la sala"><button class="btn primary" data-act="ojoin">Unirme</button></div></div></div>' + err +
    '<div class="startbar"><button class="btn" data-act="tomenu">Volver al menú</button></div>';
}

syncTools();
render();
</script>

</body></html>
